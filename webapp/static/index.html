<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SwapLab</title>
<style>
  :root {
    --bg: #0c0d10;
    --panel: #16181d;
    --ink: #f2f3f0;
    --dim: #7d8188;
    --go: #c8ff2e;
    --bad: #ff5d5d;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.45 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
    padding: max(14px, env(safe-area-inset-top)) 16px 48px;
    max-width: 480px;
    margin-inline: auto;
  }
  h1 {
    font-size: clamp(52px, 19vw, 84px);
    line-height: .88;
    letter-spacing: -.045em;
    font-weight: 800;
    margin: 18px 0 2px -3px;
  }
  h1 em { font-style: normal; color: var(--go); }
  .tagline { color: var(--dim); font-size: 13px; margin-bottom: 26px; }
  .step {
    color: var(--dim);
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    margin: 26px 0 10px;
  }
  .step b { color: var(--go); font-weight: 700; margin-right: 6px; }

  .faces { display: flex; gap: 12px; overflow-x: auto; padding: 4px 2px 10px; }
  .face { flex: 0 0 auto; text-align: center; background: none; border: 0; color: var(--dim);
          position: relative; }
  input.overlay { position: absolute; inset: 0; width: 100%; height: 100%;
                  opacity: 0; display: block; }
  .face img, .face .blank {
    width: 76px; height: 76px; border-radius: 50%;
    object-fit: cover; display: block;
    border: 3px solid transparent;
  }
  .face.sel img { border-color: var(--go); }
  .face.sel { color: var(--ink); }
  .face span { font-size: 12px; display: block; margin-top: 5px; max-width: 80px;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .face .blank {
    border: 2px dashed #3a3e46; color: var(--dim);
    display: grid; place-items: center; font-size: 30px; font-weight: 300;
  }
  .clips .face img, .clips .face .blank {
    width: 108px; height: 76px; border-radius: 6px;
  }
  .clips .face span { max-width: 112px; }
  .modechip { margin-left: 8px; text-transform: none; letter-spacing: 0; }
  .stagewrap { position: relative; margin-top: 10px; }
  .stagewrap img { width: 100%; border-radius: 6px; display: block; }
  .facebox {
    position: absolute; border: 2px solid var(--go); border-radius: 6px;
    background: none; color: var(--go); font-weight: 800; font-size: 14px;
    display: grid; place-items: start start; padding: 2px 6px;
    min-width: 34px; min-height: 34px;
  }
  .facebox.sel { background: rgba(200, 255, 46, .18); }
  .facebox.mapped { border-style: solid; }
  .facebox i { font-style: normal; background: #101203cc; border-radius: 4px;
               padding: 1px 6px; }
  .pickwrap { position: relative; display: inline-block; }
  .faceinfo { color: var(--dim); font-size: 13px; padding: 2px 2px 6px;
              display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .faceinfo .chip.mini { padding: 6px 11px; font-size: 12px; }

  .quality { display: flex; background: var(--panel); border-radius: 4px; padding: 4px; }
  .quality button {
    flex: 1; border: 0; background: none; color: var(--dim);
    padding: 12px 0; font-size: 14px; font-weight: 600; border-radius: 3px;
  }
  .quality button.sel { background: #23262d; color: var(--ink); }

  .opt { text-transform: none; letter-spacing: 0; }
  .extras { display: flex; gap: 10px; flex-wrap: wrap; }
  .chip {
    background: var(--panel); border: 1px solid #3a3e46; color: var(--dim);
    border-radius: 999px; padding: 11px 18px; font-size: 14px; font-weight: 600;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .chip.sel { border-color: var(--go); color: var(--ink); }
  .chip.mini { padding: 8px 13px; font-size: 16px; }
  #editor { background: var(--panel); border-radius: 6px; padding: 14px 16px 8px; margin-top: 10px; }
  #editor .presets { margin-bottom: 4px; }
  .sgroup { color: var(--dim); font-size: 11px; letter-spacing: .14em;
            text-transform: uppercase; margin: 12px 0 2px; }
  .srow { display: flex; align-items: center; gap: 12px; padding: 7px 0;
          font-size: 14px; color: var(--dim); }
  .srow input { flex: 1; accent-color: var(--go); min-width: 0; }
  .srow b { width: 42px; text-align: right; color: var(--ink);
            font-variant-numeric: tabular-nums; font-weight: 600; }

  #go {
    width: 100%;
    margin-top: 30px;
    background: var(--go);
    color: #101203;
    border: 0;
    border-radius: 6px;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -.02em;
    padding: 20px 0 22px;
  }
  #go:disabled { opacity: .35; }
  #go:active { transform: translateY(1px); }

  .strip { margin-top: 10px; }
  .job {
    display: flex; align-items: center; gap: 12px;
    background: var(--panel);
    border-left: 3px solid #3a3e46;
    padding: 12px 14px;
    margin-bottom: 8px;
    font-size: 14px;
  }
  .job.done { border-left-color: var(--go); }
  .job.failed { border-left-color: var(--bad); }
  .job .meta { flex: 1; min-width: 0; }
  .job .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .job .sub { color: var(--dim); font-size: 12px; }
  .job .sub.err { color: var(--bad); }
  .job a {
    color: #101203; background: var(--go); text-decoration: none;
    font-weight: 700; font-size: 13px; padding: 9px 14px; border-radius: 4px;
    flex-shrink: 0;
  }
  .job a.hd {
    background: none; color: var(--go); border: 1px solid #3a3e46; padding: 8px 10px;
  }
  .uplog { margin-top: 10px; font-size: 12px; color: var(--dim);
           font-variant-numeric: tabular-nums; white-space: pre-wrap; }
  .uplog.err { color: var(--bad); }
  .bar { height: 3px; background: #2a2d33; border-radius: 2px; margin-top: 7px; }
  .bar i { display: block; height: 100%; background: var(--go); border-radius: 2px;
           transition: width .6s; }
  .spin {
    width: 16px; height: 16px; flex-shrink: 0;
    border: 2px solid #3a3e46; border-top-color: var(--go);
    border-radius: 50%; animation: r 0.9s linear infinite;
  }
  @keyframes r { to { transform: rotate(360deg); } }
  .jobthumb { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
  /* eight swappers is wider than a phone — the strip scrolls, the card doesn't */
  .picks { display: flex; gap: 6px; margin-top: 8px; padding-bottom: 2px;
           overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .pick { flex: 0 0 auto; background: none; border: 1px solid #3a3e46;
          border-radius: 6px; padding: 3px; cursor: pointer;
          display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .pick.on { border-color: var(--go); }
  .pick img { width: 56px; height: 56px; object-fit: cover;
              border-radius: 4px; display: block; }
  .pick span { color: var(--dim); font-size: 10px; max-width: 60px;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pick.on span { color: var(--go); }
  .empty { color: var(--dim); font-size: 13px; padding: 6px 2px; }
  /* .faces/.quality/.extras set display: flex, which beats the UA's
     [hidden] { display: none } — force it back so hidden actually hides */
  [hidden] { display: none !important; }
  /* only inputs explicitly marked hidden — a blanket rule here made every
     visible picker untappable */
  input.hidden-input { display: none; }
</style>
</head>
<body>

<h1>SWAP<em>LAB</em></h1>
<p class="tagline">consented faces only · label it AI when you post</p>

<div class="step"><b>1</b>whose face goes in</div>
<div class="faces" id="faces"></div>
<div class="faceinfo" id="faceInfo" hidden></div>

<div class="step"><b>2</b>onto which
  <button class="chip mini modechip sel" data-mode="clip">clip</button>
  <button class="chip mini modechip" data-mode="photo">photo</button>
</div>
<div class="faces clips" id="clips"></div>
<div class="faces clips" id="photos" hidden></div>
<div id="photoStage" hidden>
  <div class="stagewrap"><img id="stageImg" alt=""></div>
  <div class="faceinfo" id="mapInfo"></div>
</div>

<div class="step videoonly"><b>3</b>how fancy</div>
<div class="quality videoonly" id="quality">
  <button data-q="fast">fast</button>
  <button data-q="good" class="sel">good</button>
  <button data-q="best">best</button>
</div>

<div class="step videoonly"><b>4</b>extras <span class="opt">(optional)</span></div>
<div class="extras videoonly">
  <label class="chip" for="audioInput" id="voiceChip">🎤 add a voice</label>
  <button class="chip" id="capChip">💬 captions</button>
  <button class="chip" id="screenChip">📱 screen recording</button>
  <button class="chip" id="allChip">👥 everyone is them</button>
</div>
<div class="extras videoonly" style="margin-top:10px">
  <button class="chip" id="editChip">🎭 face editor</button>
</div>
<div id="editor" hidden>
  <div class="extras presets">
    <button class="chip mini" data-preset='{"smile":1}'>😁</button>
    <button class="chip mini" data-preset='{"eyes":1,"lips":0.7,"brows":1}'>😱</button>
    <button class="chip mini" data-preset='{"grim":0.7,"smile":-0.6,"brows":-1}'>😠</button>
    <button class="chip mini" data-preset='{"gaze-x":1}'>👀</button>
    <button class="chip mini" data-preset='{"eyes":-0.7}'>😴</button>
    <button class="chip mini" data-preset='{"pout":1}'>😗</button>
    <button class="chip mini" id="editReset">reset</button>
  </div>
  <div class="sgroup">mouth</div>
  <label class="srow">smile<input type="range" data-c="smile" min="-1" max="1" step="0.05" value="0"><b>0</b></label>
  <label class="srow">pout<input type="range" data-c="pout" min="-1" max="1" step="0.05" value="0"><b>0</b></label>
  <label class="srow">grim<input type="range" data-c="grim" min="-1" max="1" step="0.05" value="0"><b>0</b></label>
  <label class="srow">purse<input type="range" data-c="purse" min="-1" max="1" step="0.05" value="0"><b>0</b></label>
  <label class="srow">lips open<input type="range" data-c="lips" min="-1" max="1" step="0.05" value="0"><b>0</b></label>
  <label class="srow">mouth ↔<input type="range" data-c="mouth-x" min="-1" max="1" step="0.05" value="0"><b>0</b></label>
  <label class="srow">mouth ↕<input type="range" data-c="mouth-y" min="-1" max="1" step="0.05" value="0"><b>0</b></label>
  <div class="sgroup">eyes</div>
  <label class="srow">eyes open<input type="range" data-c="eyes" min="-1" max="1" step="0.05" value="0"><b>0</b></label>
  <label class="srow">brows<input type="range" data-c="brows" min="-1" max="1" step="0.05" value="0"><b>0</b></label>
  <label class="srow">gaze ↔<input type="range" data-c="gaze-x" min="-1" max="1" step="0.05" value="0"><b>0</b></label>
  <label class="srow">gaze ↕<input type="range" data-c="gaze-y" min="-1" max="1" step="0.05" value="0"><b>0</b></label>
  <div class="sgroup">head</div>
  <label class="srow">nod<input type="range" data-c="pitch" min="-1" max="1" step="0.05" value="0"><b>0</b></label>
  <label class="srow">turn<input type="range" data-c="yaw" min="-1" max="1" step="0.05" value="0"><b>0</b></label>
  <label class="srow">tilt<input type="range" data-c="roll" min="-1" max="1" step="0.05" value="0"><b>0</b></label>
</div>

<button id="go" disabled>SWAP IT</button>
<div class="uplog" id="uplog" hidden></div>

<div class="step">the lab queue</div>
<div class="strip" id="strip"><div class="empty">nothing cooking yet</div></div>

<input class="hidden-input" type="file" id="audioInput"
       accept="audio/*,.m4a,.mp3,.wav,.ogg,.opus,.flac">

<script>
const state = { face: null, pendingFaceName: null, video: null, clip: null,
                quality: 'good', audio: null, captions: false,
                screenRecording: false, allFaces: false,
                mode: 'clip', photo: null, photoScan: null, mapping: {}, selBox: null };

// a phone has no console we can read: show failures and report them home
function report(where, detail) {
  const box = document.getElementById('uplog');
  if (box) { box.hidden = false; box.classList.add('err');
             box.textContent = `${where}: ${detail}`; }
  try {
    navigator.sendBeacon('api/clienterror', new Blob(
      [JSON.stringify({where, detail, ua: navigator.userAgent})],
      {type: 'application/json'}));
  } catch {}
}
window.onerror = (msg, src, line) => report('js error', `${msg} (line ${line})`);
window.onunhandledrejection = e => report('js error', e.reason?.message || String(e.reason));

const $ = id => document.getElementById(id);

async function loadFaces() {
  const faces = await fetch('api/faces').then(r => r.json());
  const box = $('faces');
  box.innerHTML = '';
  for (const f of faces) {
    const b = document.createElement('button');
    b.className = 'face' + (state.face === f.name ? ' sel' : '');
    b.innerHTML = `<img src="api/faces/${encodeURIComponent(f.name)}/thumb?v=${f.count}" alt="">
                   <span>${f.name}${f.count > 1 ? ' · ' + f.count : ''}</span>`;
    b.onclick = () => {
      if (state.mode === 'photo' && state.photo != null && state.selBox != null) {
        state.mapping[state.selBox] = f.name;
        state.selBox = null;
        paintBoxes();
      }
      state.face = f.name; state.newFace = null; loadFaces(); ready();
    };
    box.appendChild(b);
  }
  const add = document.createElement('div');
  add.className = 'face';
  // video/* MUST lead: with image/* first, iOS hands Safari a re-encoded
  // low-res copy of a picked video (measured: a 4K capture arrived 360x480).
  // The clip picker below has always had this order and carries 4K intact.
  add.innerHTML = `<div class="blank">+</div><span>new face</span>
    <input class="overlay" type="file" accept="video/*,image/*">`;
  add.querySelector('input').onchange = e => { state.pendingFaceName = null; onFacePicked(e); };
  box.appendChild(add);
  const sel = faces.find(f => f.name === state.face);
  $('faceInfo').hidden = !sel;
  if (sel) {
    $('faceInfo').innerHTML =
      `${sel.count} photo${sel.count > 1 ? 's' : ''} of ${sel.name} — a capture video ` +
      `rebuilds their angles <span class="chip mini pickwrap">+ photo/video` +
      `<input class="overlay" type="file" accept="video/*,image/*"></span> ` +
      `<button class="chip mini" id="delFace">remove</button>`;
    $('faceInfo').querySelector('.pickwrap input').onchange = e => {
      state.pendingFaceName = sel.name; onFacePicked(e);
    };
    $('delFace').onclick = async () => {
      if (!confirm(`remove ${sel.name} and all their photos?`)) return;
      await fetch(`api/faces/${encodeURIComponent(sel.name)}`, { method: 'DELETE' });
      state.face = null;
      loadFaces(); ready();
    };
  }
}

async function onFacePicked(e) {
  const file = e.target.files[0];
  if (!file) return;
  const name = state.pendingFaceName ||
    prompt('name this face (they said yes, right?)\nsame name = adds more angles of them');
  if (!name) { e.target.value = ''; return; }
  const box = $('uplog');
  box.hidden = false; box.classList.remove('err');
  box.textContent = `adding ${file.name} to ${name}…`;
  const fd = new FormData();
  fd.append('name', name);
  fd.append('photo', file);
  const res = await fetch('api/faces', { method: 'POST', body: fd });
  if (!res.ok) { report('adding face failed', (await res.json()).detail); return; }
  const saved = await res.json();
  state.face = saved.name;
  e.target.value = '';
  box.textContent = saved.job
    ? `${saved.name}: building identity from that video — watch the queue below`
    : `${saved.name}: ${saved.count} photo${saved.count > 1 ? 's' : ''} ✓`;
  loadFaces(); ready(); poll();
}

async function loadClips() {
  const clips = await fetch('api/clips').then(r => r.json());
  const box = $('clips');
  box.innerHTML = '';
  for (const c of clips) {
    const b = document.createElement('button');
    b.className = 'face' + (state.clip === c.name ? ' sel' : '');
    b.innerHTML = `<img src="api/clips/${encodeURIComponent(c.file)}/thumb"
                        onerror="this.outerHTML='<div class=blank>🎬</div>'" alt="">
                   <span>${c.name}</span>`;
    b.onclick = () => { state.clip = c.name; state.video = null; loadClips(); ready(); };
    box.appendChild(b);
  }
  // invisible file input stretched over the tile: the tap lands on the
  // native input itself — the only picker pattern iOS never breaks
  const add = document.createElement('div');
  add.className = 'face' + (state.video ? ' sel' : '');
  // image/*,video/* is what makes iOS show its full sheet:
  // Photo Library / Take Photo or Video / Choose File
  add.innerHTML = `<div class="blank">+</div><span>${state.video ? state.video.name : 'new video'}</span>
    <input class="overlay" type="file" accept="video/*,image/*">`;
  add.querySelector('input').onchange = onVideoPicked;
  box.appendChild(add);
}

const VIDEO_EXTS = ['.mp4', '.mov', '.webm'];

function onVideoPicked(e) {
  const file = e.target.files[0] || null;
  const box = $('uplog');
  if (!file) return;
  if (!VIDEO_EXTS.some(x => file.name.toLowerCase().endsWith(x))) {
    box.hidden = false; box.classList.add('err');
    box.textContent = `${file.name} is not a video — pick an .mp4, .mov or .webm`;
    e.target.value = '';
    return;
  }
  e.target.value = '';
  uploadClip(file);
}

// upload straight into the library so progress is visible immediately and
// the clip is reusable; SWAP IT then only has to queue
function uploadClip(file) {
  const box = $('uplog');
  const mb = (file.size / 1e6).toFixed(1);
  box.hidden = false; box.classList.remove('err');
  box.innerHTML = `sending ${file.name} · 0 of ${mb}MB<div class="bar"><i style="width:0"></i></div>`;
  const fill = box.querySelector('i');

  const fd = new FormData();
  fd.append('video', file);
  const xhr = new XMLHttpRequest();
  xhr.open('POST', 'api/clips');
  xhr.upload.onprogress = ev => {
    if (!ev.lengthComputable) return;
    const pct = Math.round(100 * ev.loaded / ev.total);
    box.firstChild.textContent = `sending ${file.name} · ${(ev.loaded / 1e6).toFixed(1)} of ${mb}MB (${pct}%)`;
    fill.style.width = pct + '%';
  };
  xhr.onload = async () => {
    if (xhr.status >= 300) {
      let detail = xhr.statusText;
      try { detail = JSON.parse(xhr.responseText).detail || detail; } catch {}
      report('upload failed', `${xhr.status} ${detail} (${file.name}, ${mb}MB)`);
      return;
    }
    const saved = JSON.parse(xhr.responseText);
    state.clip = saved.name;
    state.video = null;
    box.textContent = `${saved.name} uploaded ✓ — pick a face and tap SWAP IT`;
    await loadClips(); ready();
  };
  xhr.onerror = () => report('upload failed',
    `connection dropped after ${xhr.upload._sent || '?'} (${file.name}, ${mb}MB)`);
  xhr.send(fd);
}

for (const chip of document.querySelectorAll('.modechip')) {
  chip.onclick = () => {
    state.mode = chip.dataset.mode;
    for (const c of document.querySelectorAll('.modechip'))
      c.classList.toggle('sel', c === chip);
    $('clips').hidden = state.mode !== 'clip';
    $('photos').hidden = state.mode !== 'photo';
    $('photoStage').hidden = state.mode !== 'photo' || !state.photo;
    const photoMode = state.mode === 'photo';
    for (const el of document.querySelectorAll('.videoonly')) el.hidden = photoMode;
    if (photoMode) $('editor').hidden = true;   // chip reopens it in clip mode
    paintMode(); ready();
  };
}

async function loadPhotos() {
  const photos = await fetch('api/photos').then(r => r.json());
  const box = $('photos');
  box.innerHTML = '';
  for (const p of photos) {
    const b = document.createElement('button');
    b.className = 'face' + (state.photo === p.file ? ' sel' : '');
    b.innerHTML = `<img src="api/photos/${encodeURIComponent(p.file)}" alt="">
                   <span>${p.name}</span>`;
    b.onclick = () => selectPhoto(p);
    box.appendChild(b);
  }
  const add = document.createElement('div');
  add.className = 'face';
  add.innerHTML = `<div class="blank">+</div><span>new photo</span>
    <input class="overlay" type="file" accept="image/*,.heic,.heif">`;
  add.querySelector('input').onchange = e => {
    const file = e.target.files[0];
    e.target.value = '';
    if (file) uploadPhoto(file);
  };
  box.appendChild(add);
}

function uploadPhoto(file) {
  const box = $('uplog');
  const mb = (file.size / 1e6).toFixed(1);
  box.hidden = false; box.classList.remove('err');
  box.innerHTML = `sending ${file.name} · 0 of ${mb}MB<div class="bar"><i style="width:0"></i></div>`;
  const fill = box.querySelector('i');

  const fd = new FormData();
  fd.append('photo', file);
  const xhr = new XMLHttpRequest();
  xhr.open('POST', 'api/photos');
  xhr.upload.onprogress = ev => {
    if (!ev.lengthComputable) return;
    const pct = Math.round(100 * ev.loaded / ev.total);
    box.firstChild.textContent = `sending ${file.name} · ${(ev.loaded / 1e6).toFixed(1)} of ${mb}MB (${pct}%)`;
    fill.style.width = pct + '%';
  };
  xhr.onload = async () => {
    if (xhr.status >= 300) {
      let detail = xhr.statusText;
      try { detail = JSON.parse(xhr.responseText).detail || detail; } catch {}
      report('upload failed', `${xhr.status} ${detail} (${file.name}, ${mb}MB)`);
      return;
    }
    const saved = JSON.parse(xhr.responseText);
    box.textContent = `${saved.name} uploaded ✓ — tap a face, then who it becomes`;
    selectPhoto(saved);
  };
  xhr.onerror = () => report('upload failed',
    `connection dropped after ${xhr.upload._sent || '?'} (${file.name}, ${mb}MB)`);
  xhr.send(fd);
}

async function selectPhoto(p) {
  state.photo = p.file;
  state.photoScan = p.faces ? p : await fetch(`api/photos/${encodeURIComponent(p.file)}/faces`)
      .then(r => r.json()).then(scan => ({...p, ...scan}));
  state.mapping = {}; state.selBox = null;
  $('photoStage').hidden = false;
  $('stageImg').src = `api/photos/${encodeURIComponent(p.file)}`;
  paintBoxes(); loadPhotos(); ready();
}

function paintBoxes() {
  const wrap = document.querySelector('.stagewrap');
  for (const old of wrap.querySelectorAll('.facebox')) old.remove();
  const scan = state.photoScan;
  if (!scan) return;
  for (const f of scan.faces) {
    const b = document.createElement('button');
    b.className = 'facebox' + (state.selBox === f.index ? ' sel' : '')
                + (state.mapping[f.index] ? ' mapped' : '');
    b.style.left = `${100 * f.x / scan.width}%`;
    b.style.top = `${100 * f.y / scan.height}%`;
    b.style.width = `${100 * f.w / scan.width}%`;
    b.style.height = `${100 * f.h / scan.height}%`;
    b.innerHTML = `<i>${f.index + 1}${state.mapping[f.index] ? ' → ' + state.mapping[f.index] : ''}</i>`;
    b.onclick = () => { state.selBox = state.selBox === f.index ? null : f.index;
                        delete state.mapping.all; paintBoxes(); paintMode(); };
    wrap.appendChild(b);
  }
  paintMode();
}

function paintMode() {
  if (state.mode !== 'photo' || !state.photoScan) return;
  const n = Object.keys(state.mapping).filter(k => k !== 'all').length;
  $('mapInfo').innerHTML = state.mapping.all
    ? `everyone becomes <b>${state.mapping.all}</b> `
    : state.selBox != null
      ? `now tap a face up top to assign face ${state.selBox + 1} `
      : n ? `${n} face${n > 1 ? 's' : ''} assigned — tap SWAP IT `
          : `tap a numbered face, then tap whose face goes in `;
  const all = document.createElement('button');
  all.className = 'chip mini'; all.textContent = state.mapping.all ? 'undo everyone' : '👥 everyone';
  all.onclick = () => {
    if (state.mapping.all) { delete state.mapping.all; }
    else if (state.face) { state.mapping = { all: state.face }; state.selBox = null; }
    else { report('photo mode', 'pick whose face goes in first (step 1)'); return; }
    paintBoxes();
  };
  $('mapInfo').appendChild(all);
  ready();
}

$('voiceChip').onclick = e => {
  if (state.audio) {          // second tap clears instead of opening the picker
    e.preventDefault();
    state.audio = null;
    $('audioInput').value = '';
    $('voiceChip').textContent = '🎤 add a voice';
    $('voiceChip').classList.remove('sel');
  }
};
$('audioInput').onchange = e => {
  state.audio = e.target.files[0] || null;
  $('voiceChip').textContent = state.audio ? `🎤 ${state.audio.name} ✕` : '🎤 add a voice';
  $('voiceChip').classList.toggle('sel', !!state.audio);
};
$('capChip').onclick = () => {
  state.captions = !state.captions;
  $('capChip').classList.toggle('sel', state.captions);
};
$('screenChip').onclick = () => {
  state.screenRecording = !state.screenRecording;
  $('screenChip').classList.toggle('sel', state.screenRecording);
};
$('allChip').onclick = () => {      // every detected face, not just the main one
  state.allFaces = !state.allFaces;
  $('allChip').classList.toggle('sel', state.allFaces);
};
const sliders = [...document.querySelectorAll('#editor input[type=range]')];

function edits() {
  const out = {};
  for (const s of sliders) {
    const v = parseFloat(s.value);
    if (v) out[s.dataset.c] = v;
  }
  return out;
}
function paintEditor() {
  for (const s of sliders) s.nextElementSibling.textContent = (+s.value).toFixed(2).replace(/\.?0+$/, '') || '0';
  const n = Object.keys(edits()).length;
  $('editChip').textContent = n ? `🎭 face editor · ${n}` : '🎭 face editor';
  $('editChip').classList.toggle('sel', n > 0);
}
$('editChip').onclick = () => { $('editor').hidden = !$('editor').hidden; };
document.querySelector('#editor').oninput = paintEditor;
document.querySelector('#editor .presets').onclick = e => {
  const preset = e.target.dataset.preset;
  if (e.target.id === 'editReset') { for (const s of sliders) s.value = 0; }
  else if (preset) {
    const vals = JSON.parse(preset);
    for (const s of sliders) s.value = vals[s.dataset.c] || 0;
  } else return;
  paintEditor();
};

$('quality').onclick = e => {
  const q = e.target.dataset.q;
  if (!q) return;
  state.quality = q;
  for (const b of $('quality').children) b.classList.toggle('sel', b.dataset.q === q);
};

function ready() {
  $('go').disabled = state.mode === 'photo'
    ? !(state.photo && (state.mapping.all || Object.keys(state.mapping).length))
    : !((state.video || state.clip) && state.face);
}

$('go').onclick = async () => {
  const fd = new FormData();
  if (state.mode === 'photo') {
    fd.append('photo_name', state.photo);
    fd.append('mapping', JSON.stringify(state.mapping));
  } else {
    if (state.video) fd.append('video', state.video);
    else fd.append('clip_name', state.clip);
    fd.append('quality', state.quality);
    fd.append('face_name', state.face);
    if (state.audio) fd.append('audio', state.audio);
    if (state.captions) fd.append('captions', 'true');
    if (state.screenRecording) fd.append('screen_recording', 'true');
    if (state.allFaces) fd.append('all_faces', 'true');
    const ed = edits();
    if (Object.keys(ed).length) fd.append('edit', JSON.stringify(ed));
  }
  $('go').disabled = true;
  $('go').textContent = 'QUEUEING…';
  const log = m => { $('uplog').hidden = false; $('uplog').classList.remove('err'); $('uplog').textContent = m; };
  try {
    await new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', 'api/jobs');
      xhr.timeout = 0;
      xhr.upload.onprogress = e => {
        if (e.lengthComputable && state.audio)
          log(`sending voice track ${Math.round(100 * e.loaded / e.total)}%`);
      };
      xhr.onload = () => {
        if (xhr.status < 300) { log('queued ✓ — watch the lab queue below'); return resolve(); }
        let detail = xhr.statusText;
        try { detail = JSON.parse(xhr.responseText).detail || detail; } catch {}
        reject(new Error(`server said ${xhr.status}: ${detail}`));
      };
      xhr.onerror = () => reject(new Error('connection dropped — try again'));
      xhr.send(fd);
    });
    if (state.mode === 'photo') {
      state.mapping = {};
      state.selBox = null;
      paintBoxes();
    } else {
      state.video = null;
      state.audio = null;
      $('audioInput').value = '';
      $('voiceChip').textContent = '🎤 add a voice';
      $('voiceChip').classList.remove('sel');
      loadClips();
    }
  } catch (err) {
    report('queueing failed', err.message);
  }
  $('go').textContent = 'SWAP IT';
  ready();
  poll();
};

function fmtAge(j) {
  if (j.status === 'running') {
    const t = j.started ? `${Math.round(Date.now() / 1000 - j.started)}s` : '';
    if (j.kind === 'photo' && j.models)      // one render per swapper, in turn
      return `model ${(j.results || []).length + 1} of ${j.models.length} · ${t}`;
    return j.progress ? `${j.progress.stage} ${j.progress.pct}% · ${t}`
                      : `starting up · ${t}`;
  }
  if (j.status === 'queued')
    return j.place > 1 ? `queued · #${j.place} in line` : 'queued · up next';
  if (j.status === 'done' && j.finished && j.started)
    return `done in ${Math.round(j.finished - j.started)}s · ${j.quality}`;
  return j.status + ' · ' + j.quality;
}

const identityDone = new Set();
const photoPick = {};        // jobId -> chosen model, survives the 3s poll

// a photo renders once per swapper; only the ones that came out are offered
const photoResults = j => (j.results || []).filter(r => r.ok && r.model);
// the variant letter IS the label — "hyperswap_1a_256" truncates to
// "hyperswap…" in a 56px tile, making 1a/1b/1c indistinguishable
const modelLabel = m => m
  .replace('_fp16', '').replace(/_(128|256)$/, '')
  .replace('hyperswap_', 'hyper ').replace('ghost_', 'ghost ')
  .replace('inswapper', 'inswap');

async function poll() {
  const jobs = await fetch('api/jobs').then(r => r.json()).catch(() => null);
  if (!jobs) return;
  for (const j of jobs) {                   // a finished build changes the gallery
    if (j.kind === 'identity' && j.status === 'done' && !identityDone.has(j.id)) {
      identityDone.add(j.id); loadFaces();
    }
  }
  const strip = $('strip');
  strip.innerHTML = jobs.length ? '' : '<div class="empty">nothing cooking yet</div>';
  for (const j of jobs) {
    const div = document.createElement('div');
    div.className = 'job ' + j.status;
    const spin = (j.status === 'running' || j.status === 'queued') ? '<div class="spin"></div>' : '';
    const picks = j.kind === 'photo' ? photoResults(j) : [];
    if (picks.length && !picks.some(r => r.model === photoPick[j.id]))
      photoPick[j.id] = picks[0].model;     // default to the first that rendered
    const chosen = photoPick[j.id];
    const q = picks.length ? `?model=${encodeURIComponent(chosen)}` : '';
    const link = j.status !== 'done' || j.kind === 'identity'
      ? ''                                  // an identity build has no file to save
      : (j.kind === 'photo'
          ? `<a href="api/jobs/${j.id}/result${q}" download>save</a>`
          : `<a href="api/jobs/${j.id}/preview" download>save</a>
             <a class="hd" href="api/jobs/${j.id}/result" download>HD</a>`);
    const extras = (j.all_faces ? ' · 👥' : '')
                 + (j.audio ? ' · 🎤' : '') + (j.captions ? ' · 💬' : '')
                 + (j.edit ? ' · 🎭' + Object.keys(j.edit).length : '');
    const sub = j.status === 'failed'
      ? `<div class="sub err">${j.error || 'failed'}</div>`
      : `<div class="sub">${j.summary || fmtAge(j)}${extras}</div>`;
    const bar = (j.status === 'running' && j.progress)
      ? `<div class="bar"><i style="width:${j.progress.pct}%"></i></div>` : '';
    // thumb, not result: eight full-size renders would be ~20MB to a phone
    const lead = (j.kind === 'photo' && j.status === 'done')
      ? `<a href="api/jobs/${j.id}/result${q}" target="_blank">
           <img class="jobthumb" src="api/jobs/${j.id}/thumb${q}"></a>` : spin;
    const picker = picks.length > 1
      ? `<div class="picks">` + picks.map(r =>
          `<button class="pick${r.model === chosen ? ' on' : ''}" data-model="${r.model}">
             <img src="api/jobs/${j.id}/thumb?model=${encodeURIComponent(r.model)}">
             <span>${modelLabel(r.model)}</span></button>`).join('') + `</div>`
      : '';
    div.innerHTML = `${lead}<div class="meta"><div class="name">${j.face} → ${j.video}</div>${sub}${bar}${picker}</div>${link}`;
    for (const button of div.querySelectorAll('.pick'))
      button.onclick = () => { photoPick[j.id] = button.dataset.model; poll(); };
    strip.appendChild(div);
  }
}

loadFaces();
loadClips();
loadPhotos();
poll();
setInterval(poll, 3000);
</script>
</body>
</html>
