<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SwapLab</title>
<style>
  :root {
    --bg: #0c0d10;
    --panel: #16181d;
    --ink: #f2f3f0;
    --dim: #7d8188;
    --go: #c8ff2e;
    --bad: #ff5d5d;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.45 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
    padding: max(14px, env(safe-area-inset-top)) 16px 48px;
    max-width: 480px;
    margin-inline: auto;
  }
  h1 {
    font-size: clamp(52px, 19vw, 84px);
    line-height: .88;
    letter-spacing: -.045em;
    font-weight: 800;
    margin: 18px 0 2px -3px;
  }
  h1 em { font-style: normal; color: var(--go); }
  .tagline { color: var(--dim); font-size: 13px; margin-bottom: 26px; }
  .step {
    color: var(--dim);
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    margin: 26px 0 10px;
  }
  .step b { color: var(--go); font-weight: 700; margin-right: 6px; }

  .faces { display: flex; gap: 12px; overflow-x: auto; padding: 4px 2px 10px; }
  .face { flex: 0 0 auto; text-align: center; background: none; border: 0; color: var(--dim); }
  .face img, .face .blank {
    width: 76px; height: 76px; border-radius: 50%;
    object-fit: cover; display: block;
    border: 3px solid transparent;
  }
  .face.sel img { border-color: var(--go); }
  .face.sel { color: var(--ink); }
  .face span { font-size: 12px; display: block; margin-top: 5px; max-width: 80px;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .face .blank {
    border: 2px dashed #3a3e46; color: var(--dim);
    display: grid; place-items: center; font-size: 30px; font-weight: 300;
  }
  .clips .face img, .clips .face .blank {
    width: 108px; height: 76px; border-radius: 6px;
  }
  .clips .face span { max-width: 112px; }

  .quality { display: flex; background: var(--panel); border-radius: 4px; padding: 4px; }
  .quality button {
    flex: 1; border: 0; background: none; color: var(--dim);
    padding: 12px 0; font-size: 14px; font-weight: 600; border-radius: 3px;
  }
  .quality button.sel { background: #23262d; color: var(--ink); }

  .opt { text-transform: none; letter-spacing: 0; }
  .extras { display: flex; gap: 10px; flex-wrap: wrap; }
  .chip {
    background: var(--panel); border: 1px solid #3a3e46; color: var(--dim);
    border-radius: 999px; padding: 11px 18px; font-size: 14px; font-weight: 600;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .chip.sel { border-color: var(--go); color: var(--ink); }
  .chip.mini { padding: 8px 13px; font-size: 16px; }
  #editor { background: var(--panel); border-radius: 6px; padding: 14px 16px 8px; margin-top: 10px; }
  #editor .presets { margin-bottom: 4px; }
  .sgroup { color: var(--dim); font-size: 11px; letter-spacing: .14em;
            text-transform: uppercase; margin: 12px 0 2px; }
  .srow { display: flex; align-items: center; gap: 12px; padding: 7px 0;
          font-size: 14px; color: var(--dim); }
  .srow input { flex: 1; accent-color: var(--go); min-width: 0; }
  .srow b { width: 42px; text-align: right; color: var(--ink);
            font-variant-numeric: tabular-nums; font-weight: 600; }

  #go {
    width: 100%;
    margin-top: 30px;
    background: var(--go);
    color: #101203;
    border: 0;
    border-radius: 6px;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -.02em;
    padding: 20px 0 22px;
  }
  #go:disabled { opacity: .35; }
  #go:active { transform: translateY(1px); }

  .strip { margin-top: 10px; }
  .job {
    display: flex; align-items: center; gap: 12px;
    background: var(--panel);
    border-left: 3px solid #3a3e46;
    padding: 12px 14px;
    margin-bottom: 8px;
    font-size: 14px;
  }
  .job.done { border-left-color: var(--go); }
  .job.failed { border-left-color: var(--bad); }
  .job .meta { flex: 1; min-width: 0; }
  .job .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .job .sub { color: var(--dim); font-size: 12px; }
  .job .sub.err { color: var(--bad); }
  .job a {
    color: #101203; background: var(--go); text-decoration: none;
    font-weight: 700; font-size: 13px; padding: 9px 14px; border-radius: 4px;
    flex-shrink: 0;
  }
  .job a.hd {
    background: none; color: var(--go); border: 1px solid #3a3e46; padding: 8px 10px;
  }
  .spin {
    width: 16px; height: 16px; flex-shrink: 0;
    border: 2px solid #3a3e46; border-top-color: var(--go);
    border-radius: 50%; animation: r 0.9s linear infinite;
  }
  @keyframes r { to { transform: rotate(360deg); } }
  .empty { color: var(--dim); font-size: 13px; padding: 6px 2px; }
  input[type=file] { display: none; }
</style>
</head>
<body>

<h1>SWAP<em>LAB</em></h1>
<p class="tagline">consented faces only · label it AI when you post</p>

<div class="step"><b>1</b>whose face goes in</div>
<div class="faces" id="faces"></div>

<div class="step"><b>2</b>onto which clip</div>
<div class="faces clips" id="clips"></div>

<div class="step"><b>3</b>how fancy</div>
<div class="quality" id="quality">
  <button data-q="fast">fast</button>
  <button data-q="good" class="sel">good</button>
  <button data-q="best">best</button>
</div>

<div class="step"><b>4</b>extras <span class="opt">(optional)</span></div>
<div class="extras">
  <button class="chip" id="voiceChip">🎤 add a voice</button>
  <button class="chip" id="capChip">💬 captions</button>
</div>
<div class="extras" style="margin-top:10px">
  <button class="chip" id="editChip">🎭 face editor</button>
</div>
<div id="editor" hidden>
  <div class="extras presets">
    <button class="chip mini" data-preset='{"smile":1}'>😁</button>
    <button class="chip mini" data-preset='{"eyes":1,"lips":0.7,"brows":1}'>😱</button>
    <button class="chip mini" data-preset='{"grim":0.7,"smile":-0.6,"brows":-1}'>😠</button>
    <button class="chip mini" data-preset='{"gaze-x":1}'>👀</button>
    <button class="chip mini" data-preset='{"eyes":-0.7}'>😴</button>
    <button class="chip mini" data-preset='{"pout":1}'>😗</button>
    <button class="chip mini" id="editReset">reset</button>
  </div>
  <div class="sgroup">mouth</div>
  <label class="srow">smile<input type="range" data-c="smile" min="-1" max="1" step="0.05" value="0"><b>0</b></label>
  <label class="srow">pout<input type="range" data-c="pout" min="-1" max="1" step="0.05" value="0"><b>0</b></label>
  <label class="srow">grim<input type="range" data-c="grim" min="-1" max="1" step="0.05" value="0"><b>0</b></label>
  <label class="srow">purse<input type="range" data-c="purse" min="-1" max="1" step="0.05" value="0"><b>0</b></label>
  <label class="srow">lips open<input type="range" data-c="lips" min="-1" max="1" step="0.05" value="0"><b>0</b></label>
  <label class="srow">mouth ↔<input type="range" data-c="mouth-x" min="-1" max="1" step="0.05" value="0"><b>0</b></label>
  <label class="srow">mouth ↕<input type="range" data-c="mouth-y" min="-1" max="1" step="0.05" value="0"><b>0</b></label>
  <div class="sgroup">eyes</div>
  <label class="srow">eyes open<input type="range" data-c="eyes" min="-1" max="1" step="0.05" value="0"><b>0</b></label>
  <label class="srow">brows<input type="range" data-c="brows" min="-1" max="1" step="0.05" value="0"><b>0</b></label>
  <label class="srow">gaze ↔<input type="range" data-c="gaze-x" min="-1" max="1" step="0.05" value="0"><b>0</b></label>
  <label class="srow">gaze ↕<input type="range" data-c="gaze-y" min="-1" max="1" step="0.05" value="0"><b>0</b></label>
  <div class="sgroup">head</div>
  <label class="srow">nod<input type="range" data-c="pitch" min="-1" max="1" step="0.05" value="0"><b>0</b></label>
  <label class="srow">turn<input type="range" data-c="yaw" min="-1" max="1" step="0.05" value="0"><b>0</b></label>
  <label class="srow">tilt<input type="range" data-c="roll" min="-1" max="1" step="0.05" value="0"><b>0</b></label>
</div>

<button id="go" disabled>SWAP IT</button>

<div class="step">the lab queue</div>
<div class="strip" id="strip"><div class="empty">nothing cooking yet</div></div>

<input type="file" id="videoInput" accept="video/mp4,video/quicktime,video/webm,video/*">
<input type="file" id="faceInput" accept="image/*">
<input type="file" id="audioInput" accept="audio/*,.m4a,.mp3,.wav,.ogg,.opus,.flac">

<script>
const state = { face: null, newFace: null, video: null, clip: null, quality: 'good',
                audio: null, captions: false };

const $ = id => document.getElementById(id);

async function loadFaces() {
  const faces = await fetch('api/faces').then(r => r.json());
  const box = $('faces');
  box.innerHTML = '';
  for (const f of faces) {
    const b = document.createElement('button');
    b.className = 'face' + (state.face === f.name ? ' sel' : '');
    b.innerHTML = `<img src="api/faces/${encodeURIComponent(f.file)}" alt=""><span>${f.name}</span>`;
    b.onclick = () => { state.face = f.name; state.newFace = null; loadFaces(); ready(); };
    box.appendChild(b);
  }
  const add = document.createElement('button');
  add.className = 'face' + (state.newFace ? ' sel' : '');
  add.innerHTML = `<div class="blank">+</div><span>${state.newFace ? state.newFace.name : 'new face'}</span>`;
  add.onclick = () => $('faceInput').click();
  box.appendChild(add);
}

$('faceInput').onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  const name = prompt('name this face (they said yes, right?)\nsame name = replaces old photo');
  if (!name) return;
  const fd = new FormData();
  fd.append('name', name);
  fd.append('photo', file);
  const saved = await fetch('api/faces', { method: 'POST', body: fd }).then(r => r.json());
  state.face = saved.name;
  state.newFace = null;
  loadFaces(); ready();
};

async function loadClips() {
  const clips = await fetch('api/clips').then(r => r.json());
  const box = $('clips');
  box.innerHTML = '';
  for (const c of clips) {
    const b = document.createElement('button');
    b.className = 'face' + (state.clip === c.name ? ' sel' : '');
    b.innerHTML = `<img src="api/clips/${encodeURIComponent(c.file)}/thumb"
                        onerror="this.outerHTML='<div class=blank>🎬</div>'" alt="">
                   <span>${c.name}</span>`;
    b.onclick = () => { state.clip = c.name; state.video = null; loadClips(); ready(); };
    box.appendChild(b);
  }
  const add = document.createElement('button');
  add.className = 'face' + (state.video ? ' sel' : '');
  add.innerHTML = `<div class="blank">+</div><span>${state.video ? state.video.name : 'new video'}</span>`;
  add.onclick = () => $('videoInput').click();
  box.appendChild(add);
}

$('videoInput').onchange = e => {
  state.video = e.target.files[0] || null;
  if (state.video) state.clip = null;
  loadClips(); ready();
};

$('voiceChip').onclick = () => {
  if (state.audio) {
    state.audio = null;
    $('audioInput').value = '';
    $('voiceChip').textContent = '🎤 add a voice';
    $('voiceChip').classList.remove('sel');
  } else {
    $('audioInput').click();
  }
};
$('audioInput').onchange = e => {
  state.audio = e.target.files[0] || null;
  $('voiceChip').textContent = state.audio ? `🎤 ${state.audio.name} ✕` : '🎤 add a voice';
  $('voiceChip').classList.toggle('sel', !!state.audio);
};
$('capChip').onclick = () => {
  state.captions = !state.captions;
  $('capChip').classList.toggle('sel', state.captions);
};
const sliders = [...document.querySelectorAll('#editor input[type=range]')];

function edits() {
  const out = {};
  for (const s of sliders) {
    const v = parseFloat(s.value);
    if (v) out[s.dataset.c] = v;
  }
  return out;
}
function paintEditor() {
  for (const s of sliders) s.nextElementSibling.textContent = (+s.value).toFixed(2).replace(/\.?0+$/, '') || '0';
  const n = Object.keys(edits()).length;
  $('editChip').textContent = n ? `🎭 face editor · ${n}` : '🎭 face editor';
  $('editChip').classList.toggle('sel', n > 0);
}
$('editChip').onclick = () => { $('editor').hidden = !$('editor').hidden; };
document.querySelector('#editor').oninput = paintEditor;
document.querySelector('#editor .presets').onclick = e => {
  const preset = e.target.dataset.preset;
  if (e.target.id === 'editReset') { for (const s of sliders) s.value = 0; }
  else if (preset) {
    const vals = JSON.parse(preset);
    for (const s of sliders) s.value = vals[s.dataset.c] || 0;
  } else return;
  paintEditor();
};

$('quality').onclick = e => {
  const q = e.target.dataset.q;
  if (!q) return;
  state.quality = q;
  for (const b of $('quality').children) b.classList.toggle('sel', b.dataset.q === q);
};

function ready() {
  $('go').disabled = !((state.video || state.clip) && state.face);
}

$('go').onclick = async () => {
  const fd = new FormData();
  if (state.video) fd.append('video', state.video);
  else fd.append('clip_name', state.clip);
  fd.append('quality', state.quality);
  fd.append('face_name', state.face);
  if (state.audio) fd.append('audio', state.audio);
  if (state.captions) fd.append('captions', 'true');
  const ed = edits();
  if (Object.keys(ed).length) fd.append('edit', JSON.stringify(ed));
  $('go').disabled = true;
  $('go').textContent = state.video ? 'UPLOADING…' : 'QUEUEING…';
  try {
    const res = await fetch('api/jobs', { method: 'POST', body: fd });
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    state.video = null;
    state.audio = null;
    $('audioInput').value = '';
    $('voiceChip').textContent = '🎤 add a voice';
    $('voiceChip').classList.remove('sel');
    loadClips();
  } catch (err) {
    alert('upload failed: ' + err.message);
  }
  $('go').textContent = 'SWAP IT';
  ready();
  poll();
};

function fmtAge(j) {
  if (j.status === 'running' && j.started)
    return `running ${Math.round((Date.now() / 1000 - j.started))}s`;
  if (j.status === 'done' && j.finished && j.started)
    return `done in ${Math.round(j.finished - j.started)}s · ${j.quality}`;
  return j.status + ' · ' + j.quality;
}

async function poll() {
  const jobs = await fetch('api/jobs').then(r => r.json()).catch(() => null);
  if (!jobs) return;
  const strip = $('strip');
  strip.innerHTML = jobs.length ? '' : '<div class="empty">nothing cooking yet</div>';
  for (const j of jobs) {
    const div = document.createElement('div');
    div.className = 'job ' + j.status;
    const spin = (j.status === 'running' || j.status === 'queued') ? '<div class="spin"></div>' : '';
    const link = j.status === 'done'
      ? `<a href="api/jobs/${j.id}/preview" download>save</a>
         <a class="hd" href="api/jobs/${j.id}/result" download>HD</a>` : '';
    const extras = (j.audio ? ' · 🎤' : '') + (j.captions ? ' · 💬' : '')
                 + (j.edit ? ' · 🎭' + Object.keys(j.edit).length : '');
    const sub = j.status === 'failed'
      ? `<div class="sub err">${j.error || 'failed'}</div>`
      : `<div class="sub">${fmtAge(j)}${extras}</div>`;
    div.innerHTML = `${spin}<div class="meta"><div class="name">${j.face} → ${j.video}</div>${sub}</div>${link}`;
    strip.appendChild(div);
  }
}

loadFaces();
loadClips();
poll();
setInterval(poll, 3000);
</script>
</body>
</html>
