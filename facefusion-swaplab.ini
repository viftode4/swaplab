; SwapLab detection tuning, passed to facefusion via --config-path.
; Defaults miss the face on frames where the head turns or motion blurs it,
; and a missed frame shows the original face for an instant — the worst kind
; of flicker. Lower thresholds keep the swap present on those frames; the
; extra low-confidence detections are harmless because face_selector_mode
; only ever swaps the most prominent face.

[face_detector]
face_detector_score = 0.3
face_detector_angles = 0 90 180 270

[face_landmarker]
face_landmarker_score = 0.3

; Benchmark winner for vlad's identity (bench-results/20260801-131230).
; NOTE: this key belongs to [processors], not a [face_swapper] section —
; facefusion has no such section, so a model set there is silently ignored.
; inswapper both scored highest (0.90 mean ArcFace) and held facial
; structure best on the vlad->vlad self-test; ghost_1/ghost_2 scored well
; but visibly feminize the face (fuller redder lips, heavier brows).
[processors]
face_swapper_model = inswapper_128_fp16
